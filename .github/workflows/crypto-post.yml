name: crypto-post

on:
  schedule:
    # 台灣時間 09:00～11:55 每 5 分鐘檢查一次；到點且今天還沒發才發，GitHub 漏跑也會被下一次補上
    # 公開 repo：不限分鐘，用這行。私有 repo（每月共用 2,000 分鐘）：改成 "*/20 1-3 * * *"
    - cron: "*/5 1-3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = 只檢查不發文，0 = 真的發文"
        default: "1"

permissions:
  contents: write
  actions: write

concurrency: crypto-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 發下一篇
        id: post
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python post.py

      - name: 記錄已發文
        if: steps.post.outputs.published == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add posted.json
          git commit -m "posted"
          git push

      - name: 全部發完，自動停用排程
        if: steps.post.outputs.finished == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable crypto-post.yml --repo "${{ github.repository }}"
